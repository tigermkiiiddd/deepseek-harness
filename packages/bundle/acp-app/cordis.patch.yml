# The dsh-acp-app bundle patch: an automation-only ACP server over dsh-base.
# This profile is used by first-class `dsh` team members: the member process
# boots the same installation as the main instance, but with its own harness
# home so its sessions stay isolated. Settings and credentials are read from
# that member home (seeded once at creation by the main instance), so the
# member is fully self-contained and inherits nothing from the main instance.

# stdout carries ACP JSON-RPC; keep HMR quiet.
- id: hmr
  disabled: true

# The acp automation server; provider/model are left unset so agents created
# through the bridge use the shared agent-default-model service and the
# settings-driven adapters mounted by dsh-base. The agent's model is exposed
# as a session config option (see acp/src/index.ts), so the member tool can
# query and change it at runtime.
- insert:
    - id: acp
      name: '@deepseek-ai/dsh-acp'

# The preset roster, so each created agent joins a standing preset and thus
# carries its persona (and tools). `config/agent-presets/` ships with the
# deployment and is read-only; `$DSH_HOME/.agent-presets` is where a member's
# own preset lives, seeded into its home at creation by the main instance. The
# shipped root is patched in by `apps/cli`'s composeProfile; the writable root
# is `dsh-agent-presets`' own default (`includeUserRoot`). A member that carries
# its own preset points its home's settings at it, so `default: standard` only
# covers members seeded without one.
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
